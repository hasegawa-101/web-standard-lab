name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - run: npm ci
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          BRANCH: deploy-target
          FOLDER: dist
          CLEAN: true