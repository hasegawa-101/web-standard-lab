<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popover API | Web Standard LAB</title>
</head>
<body>
<h1>Popover API</h1>
<main>
    <button popovertarget="mypopover">ポップオーバーを開く</button>
    <div id="mypopover" popover>ポップオーバーやで</div>

    <button popovertarget="autofocus-popover">autofocus!!!!</button>
    <div id="autofocus-popover" popover>
        <label>
            フォーカスされるやで：
            <input type="text" autofocus>
        </label>
        <button popovertarget="autofocus-popover" popovertargetaction="hide">閉じる</button>
    </div>
</main>
</body>
</html>
