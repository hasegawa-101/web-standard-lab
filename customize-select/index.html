<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Select</title>
  <script type="module" crossorigin src="/web-standard-lab/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <link rel="stylesheet" crossorigin href="/web-standard-lab/assets/customizeSelect-tgf49SG0.css">
</head>

<body>
    <h1>Customize Select</h1>
    <main>
        <select class="emoji-select">
            <button><selectedoption></selectedoption></button>
            <div class="emotion-groups">
                <div class="emotion-group">
                    <h2>Happy</h2>
                    <option value="Partying">Partying</option>
                    <option value="Party Popper">Party Popper</option>
                    <option value="Smiling">Smiling</option>
                    <option value="Tears of Joy">Tears of Joy</option>
                    <option value="Heart Eyes">Heart Eyes</option>
                    <option value="Cool">Cool</option>
                </div>

                <div class="emotion-group">
                    <h2>Sad</h2>
                    <option value="Crying">Crying</option>
                    <option value="Disappointed">Disappointed</option>
                    <option value="Pensive">Pensive</option>
                    <option value="Confused">Confused</option>
                </div>

                <div class="emotion-group">
                    <h2>Angry</h2>
                    <option value="Super Mad">Super Mad</option>
                    <option value="Angry">Angry</option>
                </div>
            </div>
        </select>
    </main>
</body>

</html>
